name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK (test build)
        if: env.HAS_SIGNING_KEY != 'true'
        run: gradle assembleDebug

      - name: Restore release signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > eyecare-release.jks

      - name: Build signed release APK
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/eyecare-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload debug APK
        if: env.HAS_SIGNING_KEY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EyeCareApp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed release APK
        if: env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EyeCareApp-release-apk
          path: app/build/outputs/apk/release/app-release.apk
