name: Production Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.11.1
      - name: Compile debug build
        run: gradle clean assembleStandardDebug

      - name: Verify debug APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload validation debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EyeCareApp-v1.6-standard-debug-apk
          path: app/build/outputs/apk/standard/debug/app-standard-debug.apk
          if-no-files-found: error

  release:
    needs: validation
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.11.1

      - name: Check production signing configuration
        run: |
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            echo "Production signing is configured."
          else
            echo "Production signing is not configured."
            echo "A debug APK will be produced for testing."
            echo "For a signed production APK/AAB, add:"
            echo "KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD"
          fi

      - name: Restore release signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > eyecare-release.jks
          test -s eyecare-release.jks

      - name: Build signed release APK and AAB
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/eyecare-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle clean assembleStandardRelease bundleStandardRelease

      - name: Verify release outputs
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          test -s app/build/outputs/apk/standard/release/app-standard-release.apk
          test -s app/build/outputs/bundle/standardRelease/app-standard-release.aab
          ls -lh app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed release APK
        if: env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EyeCareApp-v1.6-standard-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release AAB
        if: env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EyeCareApp-v1.6-standard-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Build debug APK fallback
        if: env.HAS_SIGNING_KEY != 'true'
        run: |
          gradle clean assembleDebug

      - name: Upload debug APK fallback
        if: env.HAS_SIGNING_KEY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EyeCareApp-v1.6-standard-debug-apk-fallback
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
